[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.30.0"
description = "⚡ Forge — self-hosted AI coding agent (TUI + Web + CLI, Claude Code / Codex style)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "rich>=13.7",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.10"]

[project.scripts]
forge = "tui.launch:main"

[tool.setuptools]
packages = ["engine", "server", "cli", "tui"]
include-package-data = true

[tool.setuptools.package-data]
server = ["static/**/*"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
