services:
  forge:
    build: .
    container_name: forge-agent
    ports:
      - "8000:8000"
    environment:
      # Cách 1: đặt key qua biến môi trường (ưu tiên hơn config file)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - FORGE_MODEL=${FORGE_MODEL:-anthropic/claude-sonnet-5.5}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # LƯU Ý: agent chạy lệnh shell BÊN TRONG container này.
    # Chỉ expose công khai khi đã đặt sau reverse-proxy có auth (xem DEPLOY.md).
