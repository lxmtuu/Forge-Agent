services:
  forge:
    build: .
    container_name: forge-agent
    ports:
      # An toàn mặc định: chỉ reverse proxy trên cùng host truy cập.
      # Không expose public trực tiếp; dùng HTTPS proxy theo DEPLOY.md.
      - "127.0.0.1:8000:8000"
    volumes:
      # Provider key + Auth DB (password/session hash) chỉ nằm ở volume này, không trong image.
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Setup trước khi mở cho người dùng:
    # docker compose run --rm forge python scripts/setup_keys.py --provider openrouter --release
    # Google: --provider google. Sau đó: docker compose up -d
    # Không đặt API key/password trong file này hoặc shell history.
